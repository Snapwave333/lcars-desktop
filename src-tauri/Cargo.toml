[package]
name = "lcars-shell"
version = "0.1.0"
description = "LCARS-inspired desktop shell for Windows"
authors = ["LCARS Desktop contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.82"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "lcars-shell"
path = "src/main.rs"

[lib]
name = "lcars_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.2", features = [] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"
png = "0.18"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
